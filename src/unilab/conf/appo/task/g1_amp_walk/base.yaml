# @package _global_
# Fixed-forward, walk-only G1 AMP task. This owner deliberately does not inherit
# gait phase or default-pose reward authority from g1_walk_flat.
env:
  scene:
    model_file: src/unilab/assets/robots/g1/scene_flat.xml
    fragment_files: [src/unilab/assets/robots/g1/amp_walk_task.xml]
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: pelvis
        joint_names:
          - left_hip_pitch_joint
          - left_hip_roll_joint
          - left_hip_yaw_joint
          - left_knee_joint
          - left_ankle_pitch_joint
          - left_ankle_roll_joint
          - right_hip_pitch_joint
          - right_hip_roll_joint
          - right_hip_yaw_joint
          - right_knee_joint
          - right_ankle_pitch_joint
          - right_ankle_roll_joint
          - waist_yaw_joint
          - waist_roll_joint
          - waist_pitch_joint
          - left_shoulder_pitch_joint
          - left_shoulder_roll_joint
          - left_shoulder_yaw_joint
          - left_elbow_joint
          - left_wrist_roll_joint
          - left_wrist_pitch_joint
          - left_wrist_yaw_joint
          - right_shoulder_pitch_joint
          - right_shoulder_roll_joint
          - right_shoulder_yaw_joint
          - right_elbow_joint
          - right_wrist_roll_joint
          - right_wrist_pitch_joint
          - right_wrist_yaw_joint
        actuator_names:
          - left_hip_pitch_joint
          - left_hip_roll_joint
          - left_hip_yaw_joint
          - left_knee_joint
          - left_ankle_pitch_joint
          - left_ankle_roll_joint
          - right_hip_pitch_joint
          - right_hip_roll_joint
          - right_hip_yaw_joint
          - right_knee_joint
          - right_ankle_pitch_joint
          - right_ankle_roll_joint
          - waist_yaw_joint
          - waist_roll_joint
          - waist_pitch_joint
          - left_shoulder_pitch_joint
          - left_shoulder_roll_joint
          - left_shoulder_yaw_joint
          - left_elbow_joint
          - left_wrist_roll_joint
          - left_wrist_pitch_joint
          - left_wrist_yaw_joint
          - right_shoulder_pitch_joint
          - right_shoulder_roll_joint
          - right_shoulder_yaw_joint
          - right_elbow_joint
          - right_wrist_roll_joint
          - right_wrist_pitch_joint
          - right_wrist_yaw_joint
        body_names:
          - pelvis
          - left_hip_roll_link
          - left_knee_link
          - left_ankle_roll_link
          - right_hip_roll_link
          - right_knee_link
          - right_ankle_roll_link
          - left_shoulder_roll_link
          - left_elbow_link
          - left_wrist_yaw_link
          - right_shoulder_roll_link
          - right_elbow_link
          - right_wrist_yaw_link
          - torso_link
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  observations:
    policy:
      # Observation noise matches the legacy noise_config (level=1.0, actor-only
      # since the critic reads clean observations): gyro +/-0.2, gravity +/-0.05,
      # joint pos +/-0.01, joint vel +/-1.5, applied before term scaling.
      enable_corruption: true
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: torso_gyro}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.2
            n_max: 0.2
            operation: add
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params: {sensor_name: torso_upvector}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.05
            n_max: 0.05
            operation: add
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
            operation: add
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -1.5
            n_max: 1.5
            operation: add
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
    critic:
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: torso_gyro}
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params: {sensor_name: torso_upvector}
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: pelvis_local_linvel}
    amp_style:
      terms:
        state:
          func: unilab.tasks.locomotion.g1.amp_terms.G1AmpObservation
          params:
            asset_cfg:
              _target_: unilab.managers.SceneEntityCfg
              name: robot
              body_names:
                - pelvis
                - left_hip_roll_link
                - left_knee_link
                - left_ankle_roll_link
                - right_hip_roll_link
                - right_knee_link
                - right_ankle_roll_link
                - left_shoulder_roll_link
                - left_elbow_link
                - left_wrist_yaw_link
                - right_shoulder_roll_link
                - right_elbow_link
                - right_wrist_yaw_link
                - torso_link
              preserve_order: true
  actions:
    joint_pos:
      _target_: unilab.envs.mdp.JointPositionActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: 0.25
      use_default_offset: true
  commands:
    twist:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1VelocityCommandCfg
      entity_name: robot
      resampling_time_range: [20.0, 20.0]
      heading_command: false
      heading_control_stiffness: 0.5
      rel_standing_envs: 0.0
      rel_heading_envs: 0.0
      rel_world_envs: 0.0
      rel_forward_envs: 0.0
      init_velocity_prob: 0.0
      planar_dead_zone: 0.0
      ranges:
        lin_vel_x: [1.0, 1.0]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [0.0, 0.0]
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform
      mode: reset
      params:
        pose_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [-3.141592653589793, 3.141592653589793]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.5, 0.5]
          roll: [-0.5, 0.5]
          pitch: [-0.5, 0.5]
          yaw: [-0.5, 0.5]
    pd_gains:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [0.9, 1.1]
        kd_range: [0.9, 1.1]
        operation: scale
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    tilt:
      func: unilab.tasks.locomotion.g1.manager_terms.g1_tilt_exceeded
      params:
        max_tilt_deg: 25.0
  policy_observation_group: policy
  critic_observation_group: critic
  additional_observation_groups:
    amp: amp_style

reward:
  tracking_lin_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_lin_vel
    weight: 2.0
    params:
      tracking_sigma: 0.25
      command_name: twist
      sensor_name: pelvis_local_linvel
  tracking_ang_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_ang_vel
    weight: 0.2
    params:
      tracking_sigma: 0.25
      command_name: twist
      sensor_name: torso_gyro
  lin_vel_z:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.lin_vel_z
    weight: -1.0
    params:
      sensor_name: pelvis_local_linvel
  ang_vel_xy:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.ang_vel_xy
    weight: -0.25
    params:
      sensor_name: torso_gyro
  orientation:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.orientation
    weight: -5.0
    params:
      sensor_name: torso_upvector
  action_rate:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.01
  alive:
    func: unilab.tasks.locomotion.common.manager_terms.alive
    weight: 1.0
  self_collisions:
    func: unilab.tasks.locomotion.g1.amp_terms.SelfCollisionPenalty
    weight: -0.1
    params:
      sensor_name: self_collision
      history_length: 4
      force_threshold: 10.0
