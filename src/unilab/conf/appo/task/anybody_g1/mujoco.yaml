# @package _global_
# Opt-in direct RL; no teacher, no local run. ADR-0009.
training:
  task_name: G1MotionTracking
  sim_backend: mujoco
  play_steps: 1000
  no_play: true
  export_policy: false
algo:
  num_envs: 1024
  max_iterations: 5000
  save_interval: 500
  algorithm:
    adaptive_kl_factor: 2.0
    adaptive_lr_factor: 1.5
    enable_compile: false
  algo_log_name: anybody_direct_rl
  obs_groups:
    actor:
      policy: 0
    critic:
      policy: 0
  actor:
    class_name: unilab.rl.algos.anybody.MUSEActorModel
    hidden_dims:
    - 1024
    - 512
    - 256
    - 128
    activation: gelu
    obs_normalization: false
    history_length: 5
    latent_dim: 16
    d_model: 192
    nhead: 4
    num_layers: 2
    ffn_dim: 768
    goal_term_sizes:
    - 58
    - 6
    - 3
    - 3
    - 3
    proprio_term_sizes:
    - 29
    - 29
    - 3
    - 29
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.5
      std_type: log
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims:
    - 512
    - 256
    - 128
    activation: elu
    obs_normalization: false
env:
  scene:
    model_file: src/unilab/assets/robots/g1/scene_flat.xml
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: pelvis
        joint_names: &id001
        - left_hip_pitch_joint
        - left_hip_roll_joint
        - left_hip_yaw_joint
        - left_knee_joint
        - left_ankle_pitch_joint
        - left_ankle_roll_joint
        - right_hip_pitch_joint
        - right_hip_roll_joint
        - right_hip_yaw_joint
        - right_knee_joint
        - right_ankle_pitch_joint
        - right_ankle_roll_joint
        - waist_yaw_joint
        - waist_roll_joint
        - waist_pitch_joint
        - left_shoulder_pitch_joint
        - left_shoulder_roll_joint
        - left_shoulder_yaw_joint
        - left_elbow_joint
        - left_wrist_roll_joint
        - left_wrist_pitch_joint
        - left_wrist_yaw_joint
        - right_shoulder_pitch_joint
        - right_shoulder_roll_joint
        - right_shoulder_yaw_joint
        - right_elbow_joint
        - right_wrist_roll_joint
        - right_wrist_pitch_joint
        - right_wrist_yaw_joint
        actuator_names: *id001
        body_names: &id003
        - pelvis
        - left_hip_roll_link
        - left_knee_link
        - left_ankle_roll_link
        - right_hip_roll_link
        - right_knee_link
        - right_ankle_roll_link
        - torso_link
        - left_shoulder_roll_link
        - left_elbow_link
        - left_wrist_yaw_link
        - right_shoulder_roll_link
        - right_elbow_link
        - right_wrist_yaw_link
        geom_names:
        - left_foot1_collision
        - left_foot2_collision
        - left_foot3_collision
        - left_foot4_collision
        - left_foot5_collision
        - left_foot6_collision
        - left_foot7_collision
        - right_foot1_collision
        - right_foot2_collision
        - right_foot3_collision
        - right_foot4_collision
        - right_foot5_collision
        - right_foot6_collision
        - right_foot7_collision
  sim_dt: 0.006666666666666667
  ctrl_dt: 0.02
  max_episode_seconds: 10.0
  observations:
    actor:
      terms:
        command:
          func: unilab.tasks.motion_tracking.common.anybody_observations.delta_command
          params: &id002
            command_name: motion
        motion_anchor_ori_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params: *id002
        motion_anchor_pos_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_pos_b
          params: *id002
        base_lin_vel:
          func: unilab.envs.mdp.base_lin_vel
        ref_base_lin_vel:
          func: unilab.tasks.motion_tracking.common.anybody_observations.reference_anchor_lin_vel_b
          params: *id002
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          history_length: 5
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          history_length: 5
        base_ang_vel:
          func: unilab.envs.mdp.base_ang_vel
          history_length: 5
        actions:
          func: unilab.envs.mdp.last_action
          history_length: 5
        goal_mask:
          func: unilab.tasks.motion_tracking.common.anybody_observations.visible_goal_mask
      enable_corruption: false
      nan_policy: error
    critic:
      terms:
        command:
          func: unilab.envs.mdp.generated_commands
          params:
            command_name: motion
        motion_anchor_pos_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_pos_b
          params:
            command_name: motion
        motion_anchor_ori_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params:
            command_name: motion
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: pelvis_local_linvel
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: torso_gyro
        joint_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_pos_rel
          params:
            command_name: motion
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
        actions:
          func: unilab.envs.mdp.last_action
        body_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_pos_b
          params:
            command_name: motion
        body_ori:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_ori_b
          params:
            command_name: motion
  actions:
    joint_pos:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionJointPositionActionCfg
      entity_name: robot
      actuator_names:
      - .*
      scale: 0.25
      use_default_offset: true
      command_name: motion
  commands:
    motion:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionCommandCfg
      entity_name: robot
      resampling_time_range:
      - 1.0e9
      - 1.0e9
      params:
        motion_file: ???
        anchor_body_name: torso_link
        body_names: *id003
        sampling_mode: adaptive
        sampling_start_ratio: 0.0
        truncate_on_clip_end: false
        pose_range:
          x:
          - -0.05
          - 0.05
          y:
          - -0.05
          - 0.05
          z:
          - -0.01
          - 0.01
          roll:
          - -0.1
          - 0.1
          pitch:
          - -0.1
          - 0.1
          yaw:
          - -0.2
          - 0.2
        velocity_range:
          x:
          - -0.5
          - 0.5
          y:
          - -0.5
          - 0.5
          z:
          - -0.2
          - 0.2
          roll:
          - -0.52
          - 0.52
          pitch:
          - -0.52
          - 0.52
          yaw:
          - -0.78
          - 0.78
        joint_position_range:
        - -0.1
        - 0.1
        joint_default_position_range:
        - 0.0
        - 0.0
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    anchor_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_pos_z_only
      params:
        command_name: motion
        threshold: 0.25
    anchor_ori:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_ori
      params:
        command_name: motion
        threshold: 0.8
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
    ee_body_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_motion_body_pos_z_only
      params:
        command_name: motion
        threshold: 0.25
        body_names:
        - left_ankle_roll_link
        - right_ankle_roll_link
        - left_wrist_yaw_link
        - right_wrist_yaw_link
  policy_observation_group: actor
  critic_observation_group: critic
reward:
  motion_global_root_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_position_error_exp
    weight: 0.5
    params:
      command_name: motion
      std: 0.3
  motion_global_root_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_orientation_error_exp
    weight: 0.5
    params:
      command_name: motion
      std: 0.4
  motion_body_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_position_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 0.3
  motion_body_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_orientation_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 0.4
  motion_body_lin_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_linear_velocity_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 1.0
  motion_body_ang_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_angular_velocity_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 3.14
  motion_joint_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_position_error_exp
    weight: 0.0
    params:
      command_name: motion
      std: 0.2
  motion_joint_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_velocity_error_exp
    weight: 0.0
    params:
      command_name: motion
      std: 1.0
  action_rate_l2:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.1
  joint_limit:
    func: unilab.tasks.motion_tracking.common.manager_terms.joint_pos_limits
    weight: -10.0
    params:
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: .*
