# @package _global_
# Height-conditioned G1 walk owner. This overlays the canonical flat task
# without changing its command, observation, or reward semantics.
defaults:
  - /task/g1_walk_flat/mujoco
  - _self_

training:
  task_name: G1WalkHeight
  sim_backend: mujoco

env:
  observations:
    policy:
      terms:
        height_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: height}
    critic:
      terms:
        height_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: height}
  commands:
    height:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1HeightCommandCfg
      resampling_time_range: [20.0, 20.0]
      height_range: [0.3, 0.754]
      default_height: 0.754
      random_height_during_walking: true
      observe_height_command: true

reward:
  track_base_height_exp_smooth:
    func: unilab.tasks.locomotion.g1.manager_terms.track_base_height_exp_smooth
    weight: 4.0
    params:
      tracking_sigma: 0.25
      command_name: height
