defaults:
  - _self_
  - task: g1_walk_height/mujoco

algo:
  algo_log_name: distill
  seed: 1
  num_envs: 64
  dagger_iterations: 8
  dagger_samples_per_iteration: 65536
  dagger_batch_size: 512
  dagger_updates_per_iteration: 128
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  loss_type: mse
  request_timeout_seconds: 300.0

teacher:
  checkpoint_path: null
  load_run: "-1"
  checkpoint: -1
  log_root: null

student:
  model_type: mlp
  hidden_dims: [256, 256, 256]
  activation: elu
  squash_action: true
  initial_checkpoint_path: null

training:
  device: null
  collector_device: null
  log_root: null
  log_dir: null
  play_only: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
